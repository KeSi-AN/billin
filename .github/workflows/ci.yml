name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build dev APK
        run: flutter build apk --flavor dev --release

      - uses: actions/upload-artifact@v4
        with:
          name: shop_app-dev-apk
          path: build/app/outputs/flutter-apk/app-dev-release.apk
          retention-days: 14
