include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/gen/**
    # Regenerated by `dart run drift_dev make-migrations`.
    - test/drift/**

linter:
  rules:
    # App code, not a published package: doc comments where they help, not everywhere.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # Keep classic `ClassName(...)` constructors: familiar and well documented.
    unnecessary_type_name_in_constructor: false
    # Fluent builders (EscPosBuilder) return `this` on purpose.
    avoid_returning_this: false
    # pubspec dependencies are grouped by purpose instead.
    sort_pub_dependencies: false
